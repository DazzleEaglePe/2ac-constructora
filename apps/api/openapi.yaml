              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        "503":
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags:
        - health
info:
  title: A2C Inventario API
  description: Control de herramientas y maquinaria por obra — Constructora A2C
  version: 0.1.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        dni:
          type: string
          example: "30456789"
          description: DNI peruano de 8 dígitos
        password:
          type: string
        deviceName:
          type: string
          example: Galaxy A54
      required:
        - dni
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          description: Mínimo 8 caracteres, con letras y números
      required:
        - currentPassword
        - newPassword
    CreateUserDto:
      type: object
      properties:
        dni:
          type: string
          example: "35112604"
          description: DNI peruano de 8 dígitos
        fullName:
          type: string
          example: Martín Ruiz
        role:
          type: string
          enum:
            - ADMIN
            - OPERADOR
        temporaryPassword:
          type: string
          description: Contraseña temporal; el usuario deberá cambiarla en su primer ingreso
      required:
        - dni
        - fullName
        - role
        - temporaryPassword
    UpdateUserDto:
      type: object
      properties:
        fullName:
          type: string
        role:
          type: string
          enum:
            - ADMIN
            - OPERADOR
    CreateSiteDto:
      type: object
      properties:
        name:
          type: string
          example: Obra Juan Ramírez
        ownerName:
          type: string
          example: Juan Ramírez
        address:
          type: string
          example: Calle Los Pinos 245, Lima
        lat:
          type: number
          example: -12.0464
          minimum: -90
          maximum: 90
        lng:
          type: number
          example: -77.0428
          minimum: -180
          maximum: 180
      required:
        - name
        - ownerName
    UpdateSiteDto:
      type: object
      properties:
        name:
          type: string
        ownerName:
          type: string
        address:
          type: string
        lat:
          type: object
          minimum: -90
          maximum: 90
        lng:
          type: object
          minimum: -180
          maximum: 180
    CreateAssetDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - MAQUINA
            - HERRAMIENTA
        name:
          type: string
          example: Amoladora angular 4½"
        description:
          type: string
        status:
          type: string
          enum:
            - OPERATIVO
            - MANTENIMIENTO
            - BAJA
          default: OPERATIVO
        initialQuantity:
          type: number
          minimum: 1
          example: 4
        initialSiteId:
          type: string
      required:
        - type
        - name
        - initialQuantity
        - initialSiteId
    UpdateAssetDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: object
    ChangeAssetStatusDto:
      type: object
      properties:
        status:
          type: string
          enum:
            - OPERATIVO
            - MANTENIMIENTO
            - BAJA
        reason:
          type: string
          description: Obligatorio para dar de baja
      required:
        - status
    CreateAssetNoteDto:
      type: object
      properties:
        body:
          type: string
          example: Se revisó el cable y está en buen estado.
      required:
        - body
    CreateMovementObservationDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - DANADO
            - INCOMPLETO
            - FALTANTE
            - OTRO
        description:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - type
        - description
    CreateMovementDto:
      type: object
      properties:
        assetId:
          type: string
        fromSiteId:
          type: string
        toSiteId:
          type: string
        quantity:
          type: number
          minimum: 1
        note:
          type: string
        clientCreatedAt:
          type: string
        observation:
          $ref: "#/components/schemas/CreateMovementObservationDto"
      required:
        - assetId
        - fromSiteId
        - toSiteId
        - quantity
    ResolveObservationDto:
      type: object
      properties:
        resolution:
          type: string
          minLength: 3
          maxLength: 500
      required:
        - resolution
