packages:
  - 'apps/api'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true

# Parches de seguridad de dependencias transitivas (pnpm audit).
overrides:
  deepmerge-ts: ^8.0.0
  js-yaml: ^5.4.1
